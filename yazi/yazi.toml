# YAZI CONFIGURATION
[mgr]
ratio          = [ 2, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 4
max_width       = 1000
max_height      = 900
cache_dir       = ""
image_preview_protocol = "sixel"

[opener]
edit = [
    { run = 'nvim "%s"', block = true, desc = "Edit with Neovim" }
]
play = [
    { run = 'mpv --force-window "%s"', orphan = true, desc = "Play with MPV" }
]
reveal = [
    { run = 'imv "%s"', orphan = true, desc = "View image with IMV" }
]
extract = [
    { run = '7z x -snld "%s"', block = true, desc = "Extract here with 7-Zip" }
]
app_image = [
    { run = 'chmod +x "%s" && "%s"', orphan = true, desc = "Run AppImage", for = "unix" }
]

[open]
rules = [
    { url = "*.toml", use = "edit" },
    { url = "*.conf", use = "edit" },
    { url = "*.json", use = "edit" },
    { url = "*.jsonc", use = "edit" },
    { url = "*.sh",   use = "edit" },
    { url = "*.lua", use = "edit" },
    { url = "*.md",   use = "edit" },
    { url = "*.txt",  use = "edit" },
    { url = "*.py",   use = "edit" },
    { url = "*.js",   use = "edit" },
    { url = "*.ts",   use = "edit" },
    { url = "*.css",  use = "edit" },
    { url = "*.html", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml",  use = "edit" },
    { url = "*.c",    use = "edit" },
    { url = "*.cpp",  use = "edit" },
    { url = "*.h",    use = "edit" },
    { url = "*.go",   use = "edit" },
    { url = "*.rs",   use = "edit" },
    { url = "Dockerfile", use = "edit" },

    { url = "*.zip", use = "extract" },
    { url = "*.rar", use = "extract" },
    { url = "*.tar*", use = "extract" },

	{ url = "*.{AppImage,appimage}", use = "app_image" },

    { mime = "text/*", use = "edit" },
	{ mime = "application/x-7z-compressed", use = "extract" },
    { mime = "image/*", use = "reveal" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },

    { url = "*", use = "reveal" }
]

[plugin]
preload = []
