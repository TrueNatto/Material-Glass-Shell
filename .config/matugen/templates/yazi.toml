[app]
overall = { }

[manager]
cwd              = { fg = "{{colors.on_surface.default.hex}}" }
find_keyword     = { fg = "{{colors.tertiary.default.hex}}", bold = true }
find_position    = { fg = "{{colors.on_surface_variant.default.hex}}" }
symlink_target   = { fg = "{{colors.tertiary.default.hex}}" }

marker_copied    = { fg = "{{colors.primary.default.hex}}" }
marker_cut       = { fg = "{{colors.error.default.hex}}" }
marker_marked    = { fg = "{{colors.tertiary.default.hex}}" }
marker_selected  = { fg = "{{colors.primary.default.hex}}" }

count_copied     = { fg = "{{colors.primary.default.hex}}" }
count_cut        = { fg = "{{colors.error.default.hex}}" }
count_selected   = { fg = "{{colors.primary.default.hex}}" }

border_symbol    = " "
border_style     = { fg = "{{colors.primary.default.hex}}" }

[indicator]
parent   = { fg = "{{colors.secondary.default.hex}}" }
current  = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
preview  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
padding  = { open = "", close = "" }

[tabs]
active    = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
inactive  = { fg = "{{colors.on_surface_variant.default.hex}}" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
unset_main  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[status]
overall          = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
# SỬA: Thêm ký tự bo tròn hai đầu cho toàn bộ thanh trạng thái phía dưới cùng
sep_left         = { open = "", close = "" }
sep_right        = { open = "", close = "" }
perm_type        = { fg = "{{colors.secondary.default.hex}}" }
perm_read        = { fg = "{{colors.secondary.default.hex}}" }
perm_write       = { fg = "{{colors.primary.default.hex}}" }
perm_exec        = { fg = "{{colors.tertiary.default.hex}}" }
perm_sep         = { fg = "{{colors.outline_variant.default.hex}}" }
progress_label   = { fg = "{{colors.on_surface.default.hex}}" }
progress_normal  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
progress_error   = { fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" }

[which]
border           = { fg = "{{colors.primary.default.hex}}" }
cols             = 3
mask             = { bg = "{{colors.surface_container.default.hex}}" }
cand             = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
rest             = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc             = { fg = "{{colors.on_surface_variant.default.hex}}" }
separator        = " -> "
separator_style  = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border      = { fg = "{{colors.primary.default.hex}}" }
title       = { fg = "{{colors.on_surface.default.hex}}" }
body        = { fg = "{{colors.on_surface_variant.default.hex}}" }
list        = { fg = "{{colors.on_surface.default.hex}}" }
btn_yes     = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no      = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
btn_labels  = ["Yes", "No"]

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
tbl_col  = { fg = "{{colors.secondary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
value    = { fg = "{{colors.on_surface_variant.default.hex}}" }
selected = { bg = "{{colors.secondary_container.default.hex}}" }

[cmp]
border       = { fg = "{{colors.outline.default.hex}}" }
active       = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
inactive     = { fg = "{{colors.on_surface.default.hex}}" }
icon_file    = " "
icon_folder  = " "
icon_command = " "

[tasks]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
hovered  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }

[help]
border   = { fg = "{{colors.primary.default.hex}}" }
chord    = { fg = "{{colors.primary.default.hex}}" }
action   = { fg = "{{colors.on_surface_variant.default.hex}}" }
hovered  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }

[filetype]
rules = [
    { url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
    { url = "*", is = "exec", fg = "{{colors.error.default.hex}}" },
    { mime = "application/x-shellscript", fg = "{{colors.error.default.hex}}" },
    { mime = "application/zip", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "application/x-tar", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "application/x-bzip2", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "application/gzip", fg = "{{colors.tertiary.default.hex}}" },
    { url = "*", is = "link", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "text/*", fg = "{{colors.on_surface.default.hex}}" },
    { url = "*", fg = "{{colors.on_surface_variant.default.hex}}" }
]
